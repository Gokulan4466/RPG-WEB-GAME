version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: liferpg-postgres
    restart: always
    environment:
      POSTGRES_USER: liferpg_user
      POSTGRES_PASSWORD: liferpg_password
      POSTGRES_DB: liferpg_db
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferpg_user -d liferpg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
